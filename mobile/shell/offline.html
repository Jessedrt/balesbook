<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EBDD" />
    <title>BaleBook — no connection</title>
    <style>
      :root {
        --bg: #f3ebdd;
        --surface: #fbf6ec;
        --ink: #1c1712;
        --muted: #6f675c;
        --primary: #1e5843;
        --primary-fg: #f7f1e4;
        --warn: #8a5a20;
        --warn-soft: #f3e6cc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--bg);
        background-image: radial-gradient(rgba(28, 23, 18, 0.04) 0.6px, transparent 0.6px);
        background-size: 7px 7px;
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        /* Keep clear of the status bar and gesture bar. */
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      }
      .card {
        width: 100%;
        max-width: 22rem;
        background: var(--surface);
        border-radius: 24px;
        padding: 28px 22px;
        text-align: center;
        box-shadow:
          0 0 0 1px rgba(28, 23, 18, 0.06),
          0 8px 24px -12px rgba(28, 23, 18, 0.12);
      }
      .mark {
        width: 44px;
        height: 44px;
        color: var(--primary);
      }
      .icon {
        width: 34px;
        height: 34px;
        color: var(--warn);
        margin-top: 18px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 12px 0 0;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 8px 0 0;
      }
      button {
        appearance: none;
        border: 0;
        margin-top: 22px;
        width: 100%;
        min-height: 52px;
        border-radius: 16px;
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-weight: 600;
        font-size: 1rem;
      }
      button:active {
        transform: scale(0.99);
      }
      .hint {
        margin-top: 14px;
        font-size: 0.75rem;
        color: var(--warn);
        background: var(--warn-soft);
        border-radius: 12px;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="18" width="24" height="8" rx="2" fill="currentColor" opacity="0.35" />
        <rect x="6" y="12" width="20" height="8" rx="2" fill="currentColor" opacity="0.65" />
        <rect x="8" y="6" width="16" height="8" rx="2" fill="currentColor" />
      </svg>

      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 2l20 20" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M5 12.9a10 10 0 0 1 5.2-2.7" />
        <path d="M13.5 10.2a10 10 0 0 1 5.5 2.7" />
        <path d="M1.5 9.3a15 15 0 0 1 6-3.5" />
        <path d="M16 5.9a15 15 0 0 1 6.5 3.4" />
        <path d="M12 20h.01" />
      </svg>

      <h1>No connection</h1>
      <p>
        BaleBook could not reach your book. Your data is safe on the server —
        nothing is lost. Check your data or Wi-Fi and try again.
      </p>

      <button type="button" id="retry">Try again</button>

      <p class="hint" id="hint" hidden></p>
    </main>

    <script>
      // Capacitor does not expose its plugins to the error page, so the origin
      // to go back to is remembered by the app itself (see src/lib/native.ts).
      // Falling back to history.back() re-navigates to the failed load.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("balebook.origin");
        } catch (e) {
          stored = null;
        }

        var hint = document.getElementById("hint");
        if (!stored) {
          hint.hidden = false;
          hint.textContent =
            "If this keeps happening, close BaleBook and open it again.";
        }

        document.getElementById("retry").addEventListener("click", function () {
          if (stored) {
            window.location.replace(stored);
          } else if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.reload();
          }
        });
      })();
    </script>
  </body>
</html>
