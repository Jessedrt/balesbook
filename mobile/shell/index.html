<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EBDD" />
    <title>BaleBook</title>
    <style>
      :root {
        --bg: #f3ebdd;
        --primary: #1e5843;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      body {
        display: grid;
        place-items: center;
      }
      /* The real app loads from BALEBOOK_SERVER_URL; this page is only ever
         visible for a moment, or if that load fails outright. */
      .mark {
        width: 56px;
        height: 56px;
        color: var(--primary);
      }
    </style>
    <script>
      // Immediately hand over to the real app.
      (function () {
        var origin = null;
        try {
          origin = localStorage.getItem("balebook.origin");
        } catch (e) {
          origin = null;
        }
        if (origin) window.location.replace(origin);
      })();
    </script>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="4" y="18" width="24" height="8" rx="2" fill="currentColor" opacity="0.35" />
      <rect x="6" y="12" width="20" height="8" rx="2" fill="currentColor" opacity="0.65" />
      <rect x="8" y="6" width="16" height="8" rx="2" fill="currentColor" />
    </svg>
  </body>
</html>
